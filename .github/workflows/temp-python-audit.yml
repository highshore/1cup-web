name: Temporary Python dependency audit

on:
  push:
    branches:
      - chore/security-python-dependabot-sweep

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - growth-agent/requirements.txt
          - koreapas-publisher/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit
        shell: bash
        run: |
          echo "### ${{ matrix.target }}"
          pip-audit -r "${{ matrix.target }}" --desc
