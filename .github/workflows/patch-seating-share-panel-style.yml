name: Patch seating share panel style

on:
  push:
    branches:
      - fix/seating-share-panel-style
    paths:
      - .github/workflows/patch-seating-share-panel-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/seating-share-panel-style
          fetch-depth: 0

      - name: Apply seating panel/share patch
        run: python scripts/patch_seating_share_panel_style.py

      - name: Install dependencies without changing lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/meetup/[id]/EventDetailClient.tsx'
          git diff --cached --check
          git commit -m "fix(meetup): restore seating details and mirror panel in share image"
          git push origin HEAD:fix/seating-share-panel-style
