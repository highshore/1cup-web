name: Patch mobile seating drag UX

on:
  push:
    branches:
      - fix/admin-seating-dnd-share
    paths:
      - .github/workflows/patch-mobile-seating-dnd.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-seating-dnd-share
          fetch-depth: 0

      - name: Apply mobile seating UX patch
        run: python scripts/patch_mobile_seating.py

      - name: Install dependencies without changing lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/meetup/[id]/EventDetailClient.tsx'
          git diff --cached --check
          git commit -m "fix(meetup): stabilize mobile seating drag controls"
          git push origin HEAD:fix/admin-seating-dnd-share
