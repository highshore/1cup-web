name: Daily Ads readiness build

on:
  push:
    branches:
      - fix/daily-ads-readiness-20261029
      - fix/daily-ads-hashed-customer-match-20261029
  pull_request:
    paths:
      - 'app/daily/**'
      - 'app/api/daily/**'
      - 'app/lib/features/daily/**'
      - 'supabase/functions/daily/**'
      - '.github/workflows/daily-ads-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Next.js
        run: npm run build
      - name: Check Daily Supabase Edge Function types
        run: npx --yes deno@2 check --node-modules-dir=auto supabase/functions/daily/index.ts
