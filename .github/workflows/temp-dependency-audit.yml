name: Temporary dependency security audit

on:
  push:
    branches:
      - chore/security-dependabot-sweep

permissions:
  contents: read

jobs:
  audit-and-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Baseline audit
        shell: bash
        run: |
          npm audit --package-lock-only --json > root-before.json || true
          (cd scripts/migration && npm audit --package-lock-only --json > ../../migration-before.json) || true

      - name: Apply non-breaking npm audit fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          (cd scripts/migration && npm audit fix --package-lock-only --ignore-scripts) || true

      - name: Audit after non-breaking fixes
        shell: bash
        run: |
          npm audit --package-lock-only --json > root-after.json || true
          npm audit --package-lock-only --omit=dev --json > root-prod-after.json || true
          (cd scripts/migration && npm audit --package-lock-only --json > ../../migration-after.json) || true

      - name: Print result and diff
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['root-before.json','root-after.json','root-prod-after.json','migration-before.json','migration-after.json']) {
            const a = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log('\n### ' + file);
            console.log('counts=' + JSON.stringify(a.metadata?.vulnerabilities || {}));
            for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
              console.log(JSON.stringify({
                name,severity:v.severity,isDirect:v.isDirect,
                range:v.range,fixAvailable:v.fixAvailable,
                via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,title:x.title,severity:x.severity,range:x.range,url:x.url})
              }));
            }
          }
          NODE
          echo
          echo "### git diff"
          git diff -- package.json package-lock.json scripts/migration/package.json scripts/migration/package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-autofix-candidate
          path: |
            package.json
            package-lock.json
            scripts/migration/package.json
            scripts/migration/package-lock.json
            root-before.json
            root-after.json
            root-prod-after.json
            migration-before.json
            migration-after.json
