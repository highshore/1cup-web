name: Apply validated dependency security fixes

on:
  push:
    branches:
      - chore/security-dependabot-sweep

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/security-dependabot-sweep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply validated root fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm install --package-lock-only --ignore-scripts google-auth-library@11.1.0 microsoft-cognitiveservices-speech-sdk@1.51.0
          npm uninstall --package-lock-only --ignore-scripts --save-dev vercel
          npm pkg set 'scripts.deploy:vercel=npx --yes vercel@60.1.3 --prod'

      - name: Apply validated migration fixes
        shell: bash
        run: |
          cd scripts/migration
          npm install --package-lock-only --ignore-scripts firebase-admin@14.5.0
          npm pkg set 'overrides.gaxios.uuid=11.1.1'
          npm install --package-lock-only --ignore-scripts

      - name: Require zero audit findings
        run: |
          npm audit --package-lock-only
          npm audit --package-lock-only --omit=dev
          (cd scripts/migration && npm audit --package-lock-only)

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-dependency-audit.yml
          git add package.json package-lock.json scripts/migration/package.json scripts/migration/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): resolve remaining dependency advisories"
          git push origin HEAD:chore/security-dependabot-sweep
