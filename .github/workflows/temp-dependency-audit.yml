name: Temporary dependency security audit

on:
  push:
    branches:
      - chore/security-dependabot-sweep

permissions:
  contents: read

jobs:
  final-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply root security candidate
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm install --package-lock-only --ignore-scripts google-auth-library@11.1.0 microsoft-cognitiveservices-speech-sdk@1.51.0
          npm uninstall --package-lock-only --ignore-scripts --save-dev vercel
          npm pkg set 'scripts.deploy:vercel=npx --yes vercel@60.1.3 --prod'

      - name: Apply migration security candidate
        shell: bash
        run: |
          cd scripts/migration
          npm install --package-lock-only --ignore-scripts firebase-admin@14.5.0
          npm pkg set 'overrides.gaxios.uuid=11.1.1'
          npm install --package-lock-only --ignore-scripts

      - name: Require zero npm audit findings
        shell: bash
        run: |
          npm audit --package-lock-only
          npm audit --package-lock-only --omit=dev
          cd scripts/migration
          npm audit --package-lock-only

      - name: Validate app
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run check:functions
          npm run build

      - name: Validate migration tooling
        shell: bash
        run: |
          cd scripts/migration
          npm ci --ignore-scripts
          for f in *.mjs; do node --check "$f"; done
          node -e "Promise.all([import('firebase-admin/app'),import('firebase-admin/firestore'),import('firebase-admin/auth'),import('gaxios'),import('uuid')]).then(([,,,g,u])=>{ console.log('firebase-admin/gaxios imports ok'); console.log('uuid sample',u.v4()); })"

      - name: Print exact dependency diff
        shell: bash
        run: git diff -- package.json package-lock.json scripts/migration/package.json scripts/migration/package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: zero-audit-dependency-candidate
          path: |
            package.json
            package-lock.json
            scripts/migration/package.json
            scripts/migration/package-lock.json
