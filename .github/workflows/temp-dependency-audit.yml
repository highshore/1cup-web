name: Temporary dependency security audit

on:
  push:
    branches:
      - chore/security-dependabot-sweep

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show candidate versions
        run: |
          echo "google-auth-library latest=$(npm view google-auth-library version)"
          echo "speech-sdk latest=$(npm view microsoft-cognitiveservices-speech-sdk version)"
          echo "firebase-admin latest=$(npm view firebase-admin version)"
          echo "vercel latest=$(npm view vercel version)"

      - name: Apply root security candidate
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm install --package-lock-only --ignore-scripts google-auth-library@latest microsoft-cognitiveservices-speech-sdk@latest
          npm uninstall --package-lock-only --ignore-scripts --save-dev vercel
          npm pkg set 'scripts.deploy:vercel=npx --yes vercel@latest --prod'

      - name: Apply migration security candidate
        shell: bash
        run: |
          cd scripts/migration
          npm install --package-lock-only --ignore-scripts firebase-admin@14.5.0

      - name: Audit candidate
        shell: bash
        run: |
          npm audit --package-lock-only --json > root-after.json || true
          npm audit --package-lock-only --omit=dev --json > root-prod-after.json || true
          (cd scripts/migration && npm audit --package-lock-only --json > ../../migration-after.json) || true
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['root-after.json','root-prod-after.json','migration-after.json']){
            const a=JSON.parse(fs.readFileSync(f,'utf8'));
            console.log('\n### '+f+' '+JSON.stringify(a.metadata?.vulnerabilities||{}));
            for(const [name,v] of Object.entries(a.vulnerabilities||{})){
              console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via}));
            }
          }
          NODE

      - name: Install and validate app
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build

      - name: Validate migration tooling
        shell: bash
        run: |
          cd scripts/migration
          npm ci --ignore-scripts
          for f in *.mjs; do node --check "$f"; done
          node -e "Promise.all([import('firebase-admin/app'),import('firebase-admin/firestore'),import('firebase-admin/auth')]).then(()=>console.log('firebase-admin imports ok'))"

      - name: Print dependency diff
        shell: bash
        run: |
          git diff -- package.json package-lock.json scripts/migration/package.json scripts/migration/package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: clean-dependency-candidate
          path: |
            package.json
            package-lock.json
            scripts/migration/package.json
            scripts/migration/package-lock.json
            root-after.json
            root-prod-after.json
            migration-after.json
