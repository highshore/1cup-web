name: Patch seating display cleanup

on:
  push:
    branches:
      - fix/seating-display-cleanup
    paths:
      - .github/workflows/patch-seating-display-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/seating-display-cleanup
          fetch-depth: 0

      - name: Apply seating display cleanup
        run: python scripts/patch_seating_display_cleanup.py

      - name: Install dependencies without changing lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/meetup/[id]/EventDetailClient.tsx'
          git diff --cached --check
          git commit -m "fix(meetup): simplify seating participant labels"
          git push origin HEAD:fix/seating-display-cleanup
