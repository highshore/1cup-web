name: Minimize js-yaml lockfile diff

on:
  push:
    branches:
      - security/js-yaml-4.3.2

permissions:
  contents: write

jobs:
  minimize-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/js-yaml-4.3.2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore main lockfile and patch only js-yaml
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          python - <<'PY'
          from pathlib import Path

          path = Path('package-lock.json')
          text = path.read_text()
          marker = '    "node_modules/js-yaml": {'
          start = text.index(marker)
          end = text.index('\n    },', start) + len('\n    },')
          block = text[start:end]

          replacements = {
              '"version": "4.1.1"': '"version": "4.3.2"',
              'https://registry.npmjs.org/js-yaml/-/js-yaml-4.1.1.tgz': 'https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.2.tgz',
              'sha512-qQKT4zQxXl8lLwBtHMWwaTcGfFOZviOJet3Oy/xmGk2gZH677CJM9EvtfdSkgWcATZhj/55JZ0rmy3myCT5lsA==': 'sha512-SFNOvSJ+Dgf/9An904Yx+CgSlIPCkIpao4qo51lpee25TIRejdH3rhR4EZMGoNx3/TP3O+wzWuiTFl4sqbltzA==',
          }

          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r} in js-yaml block')
              block = block.replace(old, new, 1)

          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Validate clean install
        run: npm ci --ignore-scripts

      - name: Verify installed js-yaml
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const lockVersion = lock.packages?.['node_modules/js-yaml']?.version;
          const installedVersion = require('./node_modules/js-yaml/package.json').version;
          if (lockVersion !== '4.3.2' || installedVersion !== '4.3.2') {
            throw new Error(`Expected 4.3.2; lock=${lockVersion}, installed=${installedVersion}`);
          }
          console.log(`Verified lock=${lockVersion}, installed=${installedVersion}`);
          NODE

      - name: Commit minimal lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(security): minimize js-yaml lockfile update"
          git push origin HEAD:security/js-yaml-4.3.2
