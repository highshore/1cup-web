name: Apply marketing unified save patch

on:
  push:
    branches:
      - fix/marketing-unified-save

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-unified-save
          fetch-depth: 0

      - name: Patch GrowthDashboard
        run: python3 .github/scripts/patch_marketing_unified_save.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-marketing-unified-save.yml
          git rm .github/scripts/patch_marketing_unified_save.py
          git add app/lib/features/growth/components/GrowthDashboard.tsx
          git diff --cached --check
          git commit -m "fix(marketing): unify template and schedule save"
          git push origin HEAD:fix/marketing-unified-save
