name: Refresh js-yaml lockfile

on:
  push:
    branches:
      - security/js-yaml-4.3.2

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/js-yaml-4.3.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched js-yaml
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/js-yaml']?.version;
          if (version !== '4.3.2') {
            throw new Error(`Expected js-yaml 4.3.2, found ${version}`);
          }
          console.log(`Verified js-yaml ${version}`);
          NODE

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh lockfile for js-yaml 4.3.2"
          git push origin HEAD:security/js-yaml-4.3.2
