name: Apply payment location photo patch

on:
  push:
    branches:
      - fix/payment-location-photo-cards

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-location-photo-cards
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Apply payment patch
        run: python .github/scripts/tmp_payment_patch.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/payment/RegionalPaymentClient.tsx public/images/payment
          git commit -m 'chore: apply payment location photo patch'
          git push origin HEAD:fix/payment-location-photo-cards
