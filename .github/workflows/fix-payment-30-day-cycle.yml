name: Fix 30-day membership billing

on:
  push:
    paths:
      - .github/workflows/fix-payment-30-day-cycle.yml

permissions:
  contents: write

jobs:
  patch-payment-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply payment cycle and refund fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/payment/index.ts")
          text = path.read_text()

          replacements = [
              (
                  '''const RENEWAL_GRACE_DAYS = 3;''',
                  '''const RENEWAL_GRACE_DAYS = 3;

// A paid membership is always exactly 30 x 24 hours. Do not use calendar-month
// arithmetic here: setMonth(+1) produces 28-31 day billing periods depending on month.
const DAY_MS = 24 * 60 * 60 * 1000;
const MEMBERSHIP_DAYS = 30;
const FULL_REFUND_DAYS = 7;''',
              ),
              (
                  '''        const subscriptionStartDate = new Date();
        const subscriptionEndDate = new Date(subscriptionStartDate);
        subscriptionEndDate.setMonth(subscriptionEndDate.getMonth() + 1);''',
                  '''        const subscriptionStartDate = new Date();
        const subscriptionEndDate = new Date(
          subscriptionStartDate.getTime() + MEMBERSHIP_DAYS * DAY_MS,
        );''',
              ),
              (
                  '''          const newStartDate = new Date();
          const newEndDate = new Date(
            new Date().setMonth(new Date().getMonth() + 1),
          );''',
                  '''          const newStartDate = new Date();
          const newEndDate = new Date(
            newStartDate.getTime() + MEMBERSHIP_DAYS * DAY_MS,
          );''',
              ),
              (
                  '''  // Calculate refund amount (full < 7 days, prorated over 30-day month otherwise, 0 floor).
  const completedAt = new Date(lastPaymentData.completed_at as string);
  const today = new Date();
  const timeDiff = today.getTime() - completedAt.getTime();
  const daysPassed = Math.ceil(timeDiff / (1000 * 3600 * 24));

  let refundAmount = 0;
  if (daysPassed < 7) {
    refundAmount = originalPaymentAmount;
    logInfo(
      `User ${userId}: ${daysPassed} days passed. Processing full refund: ${refundAmount}`,
    );
  } else {
    const proratedAmount = Math.round(
      (originalPaymentAmount * (30 - daysPassed)) / 30,
    );
    refundAmount = Math.max(0, proratedAmount);
    logInfo(
      `User ${userId}: ${daysPassed} days passed. Processing prorated refund: ${refundAmount}`,
    );
  }''',
                  '''  // Full refund through the first exact 7 x 24 hours. After that, refund the
  // unused whole-day portion of the fixed 30-day membership. Using elapsedMs for the
  // 7-day boundary avoids Math.ceil() turning 6 days + 1 second into day 7.
  const completedAt = new Date(lastPaymentData.completed_at as string);
  const elapsedMs = Math.max(0, Date.now() - completedAt.getTime());
  const daysPassed = Math.ceil(elapsedMs / DAY_MS);

  let refundAmount = 0;
  if (elapsedMs <= FULL_REFUND_DAYS * DAY_MS) {
    refundAmount = originalPaymentAmount;
    logInfo(
      `User ${userId}: ${elapsedMs}ms elapsed (within ${FULL_REFUND_DAYS} days). Processing full refund: ${refundAmount}`,
    );
  } else {
    const proratedAmount = Math.round(
      (originalPaymentAmount * (MEMBERSHIP_DAYS - daysPassed)) / MEMBERSHIP_DAYS,
    );
    refundAmount = Math.max(0, proratedAmount);
    logInfo(
      `User ${userId}: ${daysPassed} days passed. Processing prorated refund: ${refundAmount}`,
    );
  }''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const MEMBERSHIP_DAYS = 30;' supabase/functions/payment/index.ts
          grep -q 'subscriptionStartDate.getTime() + MEMBERSHIP_DAYS \* DAY_MS' supabase/functions/payment/index.ts
          grep -q 'newStartDate.getTime() + MEMBERSHIP_DAYS \* DAY_MS' supabase/functions/payment/index.ts
          grep -q 'elapsedMs <= FULL_REFUND_DAYS \* DAY_MS' supabase/functions/payment/index.ts
          if grep -q 'subscriptionEndDate.setMonth' supabase/functions/payment/index.ts; then
            echo 'Old calendar-month membership code still exists' >&2
            exit 1
          fi
          git diff --check

      - name: Commit source fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/payment/index.ts
          git rm .github/workflows/fix-payment-30-day-cycle.yml
          git commit -m 'fix: use fixed 30-day memberships and exact refund window'
          git push origin HEAD:main
