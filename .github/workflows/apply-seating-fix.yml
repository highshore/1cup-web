name: Apply seating admin fix

on:
  push:
    branches:
      - fix/admin-seating-dnd-share
    paths:
      - .github/workflows/apply-seating-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-seating-dnd-share
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 scripts/apply_seating_fix.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/meetup/[id]/EventDetailClient.tsx'
          git commit -m "fix: improve seating drag and image sharing"
          git push origin HEAD:fix/admin-seating-dnd-share
